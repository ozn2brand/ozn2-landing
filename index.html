<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OZN2 - Pickleball brand, coming soon</title>
<meta name="description" content="OZN2 is a pickleball brand. Patience. Discernment. Decisiveness. Coming soon.">
<meta property="og:title" content="OZN2 - coming soon">
<meta property="og:description" content="A pickleball brand. Be first to know.">
<meta name="theme-color" content="#0b1b3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230b1b3a'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23d1eb2b'/%3E%3C/svg%3E">
<style>
:root{--navy:#0b1b3a;--cream:#f5f1e8;--ball:rgb(209,235,43);--muted:#8d97ad}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--navy);color:var(--cream);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.mark{display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.04em;font-size:clamp(64px,16vw,168px);line-height:1}
.mark svg{height:.78em;width:.78em;margin-right:.04em}
.mark .two{color:var(--ball)}
.soon{margin-top:36px;font-size:13px;letter-spacing:.38em;text-transform:uppercase;color:var(--ball)}
.line{margin-top:22px;font-size:clamp(17px,2.4vw,22px);font-weight:300;line-height:1.5;color:var(--cream)}
.sub{margin-top:10px;font-size:15px;color:var(--muted)}
.tag{margin-top:28px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
form{margin-top:44px;display:flex;width:100%;max-width:440px}
input[type=email]{flex:1;min-width:0;padding:16px 18px;background:transparent;border:1px solid rgba(245,241,232,.35);border-right:0;color:var(--cream);font-size:16px;border-radius:0;outline:none}
input[type=email]::placeholder{color:var(--muted)}
input[type=email]:focus{border-color:var(--ball)}
button{padding:16px 22px;background:var(--ball);color:var(--navy);border:1px solid var(--ball);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:0}
button:hover{background:var(--cream);border-color:var(--cream)}
.note{margin-top:14px;font-size:13px;color:var(--muted)}
footer{padding:24px;text-align:center;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
@media(max-width:480px){form{flex-direction:column}input[type=email]{border-right:1px solid rgba(245,241,232,.35);border-bottom:0}button{width:100%}}
</style>
</head>
<body>
<main>
  <h1 class="mark" aria-label="OZN2">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="#f5f1e8" stroke-width="14"/><g fill="#d1eb2b"><circle cx="50" cy="31" r="5"/><circle cx="50" cy="69" r="5"/><circle cx="31" cy="50" r="5"/><circle cx="69" cy="50" r="5"/></g></svg><span>ZN</span><span class="two">2</span>
  </h1>
  <!-- Tagline: Play Whole. Edit the text below to swap. -->
  <p class="tag" id="tagline">Play Whole</p>
  <p class="line">Patience. Discernment. Decisiveness.</p>
  <p class="sub">A pickleball brand.</p>
  <p class="soon">Coming soon</p>

  <!-- Form backend: Web3Forms (submissions emailed to pkempler+landing@gmail.com) -->
  <form action="https://api.web3forms.com/submit" method="post" id="signup">
    <input type="hidden" name="access_key" value="f22544b0-f687-4e20-83ee-296e290aeb49">
    <input type="hidden" name="subject" value="OZN2 signup">
    <input type="hidden" name="from_name" value="OZN2 site">
    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
    <input type="email" name="email" placeholder="Your email" required aria-label="Email address" autocomplete="email">
    <button type="submit">Be first to know</button>
  </form>
  <p class="note" id="note">One email when we launch. Nothing else.</p>
</main>
<footer>OZN2 &middot; 0-0-2</footer>
<script>
document.getElementById('signup').addEventListener('submit',function(e){
  var f=this;
  e.preventDefault();
  fetch(f.action,{method:'POST',body:new FormData(f),headers:{'Accept':'application/json'}})
   .then(function(r){document.getElementById('note').textContent=r.ok?"You're on the list. Talk soon.":"Something went wrong. Try again.";if(r.ok)f.reset();})
   .catch(function(){document.getElementById('note').textContent="Something went wrong. Try again.";});
});
</script>
</body>
</html>
