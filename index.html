<style>
:root{--navy:#0b1b3a;--cream:#f5f1e8;--ball:rgb(209,235,43);--muted:#8d97ad}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--navy);color:var(--cream);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.mark{display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.04em;font-size:clamp(64px,16vw,168px);line-height:1}
.mark svg{height:.78em;width:.78em;margin-right:.04em}
.mark .two{color:var(--ball)}
.soon{margin-top:36px;font-size:13px;letter-spacing:.38em;text-transform:uppercase;color:var(--ball)}
.line{margin-top:22px;font-size:clamp(17px,2.4vw,22px);font-weight:300;line-height:1.5;color:var(--cream)}
.sub{margin-top:10px;font-size:15px;color:var(--muted)}
.tag{margin-top:28px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
form{margin-top:44px;display:flex;width:100%;max-width:440px}
input[type=email]{flex:1;min-width:0;padding:16px 18px;background:transparent;border:1px solid rgba(245,241,232,.35);border-right:0;color:var(--cream);font-size:16px;border-radius:0;outline:none}
input[type=email]::placeholder{color:var(--muted)}
input[type=email]:focus{border-color:var(--ball)}
button{padding:16px 22px;background:var(--ball);color:var(--navy);border:1px solid var(--ball);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:0}
button:hover{background:var(--cream);border-color:var(--cream)}
.note{margin-top:14px;font-size:13px;color:var(--muted)}
footer{padding:24px;text-align:center;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
@media(max-width:480px){form{flex-direction:column}input[type=email]{border-right:1px solid rgba(245,241,232,.35);border-bottom:0}button{width:100%}}
</style>
